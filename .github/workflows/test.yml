name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Rebuild bundled server plugin
        run: npm run build

      - name: Verify committed bundle is current
        run: git diff --exit-code -- dist/server-plugin.mjs

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test
